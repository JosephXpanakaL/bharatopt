name: BharatOpt CI
on:
  push:
  pull_request:
jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DBHARATOPT_ENABLE_CUDA=OFF -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j2
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Smoke test LP
        run: ./build/bharatopt_cli --demo
      - name: Smoke test MILP
        run: ./build/bharatopt_cli --mip-demo --max-nodes 64
      - name: Smoke test QP
        run: ./build/bharatopt_cli --qp-demo
      - name: Smoke test maximization MPS
        run: ./build/bharatopt_cli --mps examples/max_demo.mps
      - name: Check JSON output
        run: ./build/bharatopt_cli --demo --json | python3 -c 'import json,sys; json.load(sys.stdin); print("valid JSON")'
      - name: Check Python
        run: python3 -m py_compile api.py scripts/benchmark.py
  cuda-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile CUDA backend
        run: |
          docker run --rm -v "$PWD:/src" -w /src nvidia/cuda:13.4.1-devel-ubuntu24.04 bash -lc             "apt-get update -qq && apt-get install -y -qq cmake && cmake -S . -B build-cuda -DBHARATOPT_ENABLE_CUDA=ON -DCMAKE_BUILD_TYPE=Release && cmake --build build-cuda -j2"
