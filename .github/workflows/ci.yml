name: CI Build and Tests

on:
  push: {}
  pull_request: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build

      - name: Configure CMake
        run: cmake -S . -B build -G Ninja

      - name: Build
        run: cmake --build build -j $(nproc)

      - name: Run tests
        run: ctest --test-dir build --output-on-failure || true

      - name: Upload test logs
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build/
name: BharatOpt CI
on:
  push:
  pull_request:
jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DBHARATOPT_ENABLE_CUDA=OFF -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j2
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Smoke test LP
        run: ./build/bharatopt --demo
      - name: Smoke test MILP
        run: ./build/bharatopt --mip-demo --max-nodes 64
      - name: Smoke test QP
        run: ./build/bharatopt --qp-demo
      - name: Smoke test maximization MPS
        run: ./build/bharatopt --mps examples/max_demo.mps
      - name: Check JSON output
        run: ./build/bharatopt --demo --json | python3 -c 'import json,sys; json.load(sys.stdin); print("valid JSON")'
      - name: Validate nonlinear refinery model
        run: |
          ./build/bharatopt --refinery-json examples/refinery_pooling.json --output build/refinery-result.json --mode certified
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("build/refinery-result.json").read_text())
          assert data["constraint_audit_passed"] is True
          assert data["objective"] is not None
          assert data["global_upper_bound"] is not None
          assert data["variables"]
          print(json.dumps(data, indent=2))
          PY
      - name: Check Streamlit app syntax
        run: python3 -m py_compile app.py
      - name: Check Python
        run: python3 -m py_compile api.py scripts/benchmark.py
  cuda-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile CUDA backend
        run: |
          docker run --rm -v "$PWD:/src" -w /src nvidia/cuda:12.6.3-devel-ubuntu24.04 bash -lc             "apt-get update -qq && apt-get install -y -qq cmake && cmake -S . -B build-cuda -DBHARATOPT_ENABLE_CUDA=ON -DCMAKE_BUILD_TYPE=Release && cmake --build build-cuda -j2"

  sanitizer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure ASan/UBSan
        run: cmake -S . -B build-asan -DBHARATOPT_ENABLE_CUDA=OFF -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
      - name: Build
        run: cmake --build build-asan -j2
      - name: Sanitized tests
        env:
          ASAN_OPTIONS: detect_leaks=0:abort_on_error=1
        run: ./build-asan/bharatopt_tests
